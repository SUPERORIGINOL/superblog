<!DOCTYPE html>
<html>
    <head>

        <title>Pictures</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/x-icon" href="icon.png">
        
        <style>
            .container{
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                grid-auto-rows: 200px;
                grid-gap: 5px;
                grid-auto-flow: dense;
            }

            .container img{
                width: 100%;
                height: 100%;
            }

            .horizontal{
                grid-column: span 2;
            }
            .vertical {
                grid-row: span 2;
            }
            .big{
                grid-column: span 2;
                grid-row: span 2;
            }
        </style>

    </head>
    <body>
        <div class="navbar">
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="bloghome.html">Blog</a>
        </div>
        <h1 style="font-family: monospace; text-align: center;">Pictures</h1>

        <div class="container">
            <div class="big">
                 <img class="center" src="https://i.imgur.com/f55ycLB.jpeg" alt="river in Prauge">
            </div>
            <div class="vertical">
                <img src="https://i.imgur.com/7XNdoDf.jpeg" alt="">
            </div>
            <div class="vertical">
                <img src="https://i.imgur.com/gv64aum.jpeg" alt="">
            </div>
            <div class="vertical">
                <img src="https://i.imgur.com/gTdeUi2.jpeg" alt="">
            </div>
        </div>

    </body>
</html>
